name: Refresh F1 Fantasy Prices

permissions:
  contents: write

# Snapshots the official (public, no auth) F1 Fantasy statistics feed daily so
# Price Manager's "Sync Official Prices" has real driver/constructor prices,
# and so a price-change trend builds up over the season for predictions.
#
# Only commits data/price_snapshots.json when the data actually changed, same
# spirit as the Cloudflare Worker's hash-based dedupe in the countdown-to-f1
# project. A commit to main here triggers the existing "Deploy to Fly.io"
# workflow (it deploys on every push to main).

on:
  schedule:
    # F1 Fantasy prices update roughly once daily — run a bit after local midnight UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  refresh-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest F1 Fantasy prices
        run: node scripts/fetch-fantasy-prices.mjs

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/price_snapshots.json; then
            echo "No price changes since last snapshot — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_snapshots.json
          git commit -m "chore: refresh F1 Fantasy price snapshot"
          git push
