name: Refresh F1 Fantasy Prices

permissions:
  contents: write

# Snapshots several official (public, no auth) F1 Fantasy feeds daily so
# the app always has up-to-date driver/constructor rosters and prices:
#
#   scripts/fetch-fantasy-prices.mjs  → data/price_snapshots.json
#     driverconstructors_4.json: prices, points, selection%
#
#   scripts/fetch-fantasy-feeds.mjs   → data/fantasy_config.json
#                                       data/fantasy_schedule.json
#                                       data/fantasy_drivers.json
#     web_config.json: game IDs, active rounds, etc.
#     raceday_en.json: full season race calendar
#     drivers/{gameId}_en.json: full player roster with numbers, headshots, colours
#     (also cross-verifies the driver list against OpenF1 and logs any mismatches)
#
# Only commits when any data file actually changed. A commit to main triggers
# the "Deploy to Fly.io" workflow.

on:
  schedule:
    # F1 Fantasy prices update roughly once daily — run a bit after local midnight UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  refresh-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest F1 Fantasy prices (statistics feed)
        run: node scripts/fetch-fantasy-prices.mjs

      - name: Fetch F1 Fantasy config, schedule, and driver roster
        run: node scripts/fetch-fantasy-feeds.mjs

      - name: Commit snapshots if changed
        run: |
          git diff --quiet -- data/price_snapshots.json data/fantasy_config.json data/fantasy_schedule.json data/fantasy_drivers.json \
            && echo "No changes since last snapshot — nothing to commit." && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_snapshots.json data/fantasy_config.json data/fantasy_schedule.json data/fantasy_drivers.json
          git commit -m "chore: refresh F1 Fantasy feed snapshots"
          git push
