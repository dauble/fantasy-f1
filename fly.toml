# fly.toml app configuration file for fantasy-f1-kb7njg
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# NOTE: internal_port must stay 8080 to match the Dockerfile's `ENV PORT=8080` /
# `EXPOSE 8080` and what server.js actually binds to. Re-running `fly launch`
# against this app resets internal_port to 3000, which breaks every request
# with connection-refused/502 even though the machine reports "started" — the
# same failure mode documented in the countdown-to-f1 project's README. If you
# see that again, set this back to 8080 and redeploy.

app = 'fantasy-f1-kb7njg'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
